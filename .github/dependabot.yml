version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: "direct"
    labels:
      - "dependencies"

  # The workflows pin each action to a release's commit; this proposes the newer ones
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
