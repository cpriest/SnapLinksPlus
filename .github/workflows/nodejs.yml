name: Node CI

on: [ 'push', 'pull_request' ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: npm install, lint, test, and build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
        env:
          CI: true
